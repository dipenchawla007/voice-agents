version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/voice_agents
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - JWT_SECRET=changethissecret
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
      - GCP_PROJECT_ID=local-development
      - GCP_STORAGE_BUCKET=voice-agent-knowledge-base
      - STORAGE_EMULATOR_HOST=http://gcs-emulator:4443
    volumes:
      - .:/app
    depends_on:
      - db
      - gcs-emulator
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=voice_agents
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  gcs-emulator:
    image: fsouza/fake-gcs-server
    ports:
      - "4443:4443"
    volumes:
      - gcs_data:/storage
    command: [ "-port", "4443", "-public-host", "gcs-emulator:4443", "-backend", "memory" ]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  # Optional Redis for caching
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  gcs_data:
